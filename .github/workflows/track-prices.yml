name: Track prices

on:
  schedule:
    - cron: "17 * * * *"      # every hour; each product is only checked when its own interval is due
  workflow_dispatch:           # "Run workflow" button on GitHub
  push:
    paths: [products.json]     # check new products right after you add them

permissions:
  contents: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_tracker.py

      - name: Save price history
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update prices"
            git pull --rebase
            git push
          fi
